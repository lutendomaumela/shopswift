# nginx/nginx.conf
# NGINX as a reverse proxy in front of Flask (Gunicorn)
#
# WHY NGINX in front of Flask?
#   Gunicorn is an application server — it handles Python.
#   NGINX handles: rate limiting, static files, buffering slow clients,
#   connection management, and (in Phase 8) TLS termination.
#   Flask/Gunicorn should never be exposed directly to the internet.

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format includes request time — useful for spotting slow endpoints
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # Gzip responses — reduces bandwidth usage
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    # Rate limiting — prevents abuse of the API
    # WHY: without this, a single bad actor can flood your free-tier EC2
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream flask_app {
        server api:5000;
    }

    server {
        listen 80;
        server_name _;

        # Security headers — basic hardening
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        # Proxy all requests to Flask
        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://flask_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # Health check endpoint bypasses rate limiting
        # Kubernetes probes and AWS health checks hit this
        location /health {
            proxy_pass http://flask_app/health;
            access_log off;
        }
    }
}
