# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml — Production deployment on EC2
#
# Key differences from docker-compose.yml (dev):
#   - NO postgres service → using RDS instead
#   - NO adminer → not needed in production
#   - NO volume bind-mounts → code is baked into the Docker image
#   - Uses ECR image ($API_IMAGE) set by deploy.sh
#   - NGINX sits in front of Flask as a proper reverse proxy
#   - All secrets come from environment variables (set by deploy.sh from SSM)
# ─────────────────────────────────────────────────────────────────────────────

services:

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    expose:
      - "5000"             # Internal only — NGINX proxies to this
    environment:
      DATABASE_URL:    ${DATABASE_URL}
      JWT_SECRET_KEY:  ${JWT_SECRET_KEY}
      SECRET_KEY:      ${SECRET_KEY}
      S3_BUCKET_NAME:  ${S3_BUCKET_NAME}
      AWS_DEFAULT_REGION: af-south-1
      FLASK_ENV:       production
      FLASK_APP:       src.app:create_app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: gunicorn --bind 0.0.0.0:5000 --workers 1 --timeout 60 "src.app:create_app()"
